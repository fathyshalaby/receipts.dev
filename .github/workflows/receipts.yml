# Receipts — visual-QA walkthrough + reasoning record for a PR.
#
# Started life as a generic template; the "Install web dependencies" and the
# NEXT_PUBLIC_SUPABASE_* env passthrough below are specific to this repo's own
# app under test (web/, a Next.js app whose middleware needs those to boot at
# all). Copying this into another repo: drop that step and env pair, and adjust
# `Boot app` / install steps for your own stack instead. It expects the agent
# to have committed `receipt-input.json` to the branch (or set the path below).
#
# Receipts are gitignored by default, so this workflow regenerates them in CI,
# publishes them to Supabase (if configured), and comments the links on the PR.
# It always also uploads the folder as an artefact, so the receipt survives even
# when no Supabase target is set.
#
# To enable hosted links, set ONE of these in repo Settings → Secrets:
#   • BYO:    RECEIPTS_SUPABASE_URL + RECEIPTS_SUPABASE_KEY (service role)
#   • Hosted: RECEIPTS_TOKEN (+ RECEIPTS_INGEST_URL if your CLI has no built-in default)
#
# The app-under-test env vars: the anon key is meant to be public (it's already
# in the deployed site's JS bundle; RLS is the real security boundary, not this
# key's secrecy) — but since this repo is public, workflow run logs are too, and
# GitHub only masks `secrets.*` values in logs, never `vars.*`. Store them as
# Secrets anyway so nothing prints them in the clear if a build ever dumps env:
#   • NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (repo Settings → Secrets)

name: receipts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install web app dependencies
        run: npm ci --prefix web

      - name: Install Playwright browser (pinned Chromium)
        run: npx playwright install --with-deps chromium

      - name: Check for receipt-input.json
        id: check
        run: |
          if [ -f receipt-input.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No receipt-input.json on this branch — skipping receipt generation."
          fi

      - name: Run QA + build receipt
        if: steps.check.outputs.present == 'true'
        env:
          RECEIPTS_API_KEY: ${{ secrets.RECEIPTS_API_KEY }} # optional; omit for visual-only
          RECEIPTS_MODEL: ${{ vars.RECEIPTS_MODEL }}
          # web/'s middleware.ts calls createServerClient on every request (including
          # the marketing page) — without these it 500s before receipts qa ever loads it.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # If a prior PR force-added .receipts/<id>/ so reviewers could see it in the
          # diff, checkout would leave that (stale, locally-generated) data sitting here.
          # qa only (re)writes qa-results.json/media on a real run — an infra failure
          # (app never booted, exit 2 below) leaves whatever's on disk untouched, so
          # without this the build step would silently re-package OLD results as if
          # this commit had just been verified. Always start from a clean slate.
          rm -rf .receipts

          set +e
          npx receipts qa --input receipt-input.json
          QA_EXIT=$?
          set -e
          if [ "$QA_EXIT" = "2" ]; then
            echo "::error::receipts qa hit an infrastructure failure (app never booted, or the browser failed to launch) — no receipt exists for this commit. Failing the job rather than publishing stale/absent data."
            exit 1
          fi
          # QA_EXIT 1 means claims genuinely failed/were inconclusive — that's expected
          # content to report, not an infra problem, so we still build + publish it.

          RECEIPT_DIR=$(ls -d .receipts/*/ | head -n1)
          echo "RECEIPT_DIR=$RECEIPT_DIR" >> "$GITHUB_ENV"
          npx receipts build --in "$RECEIPT_DIR"

      # Publish to Supabase if a target is configured. Writes publish.json with the
      # hosted report + raw video URLs; we surface them in the PR comment below.
      - name: Publish receipt to Supabase
        if: steps.check.outputs.present == 'true'
        id: publish
        env:
          RECEIPTS_SUPABASE_URL: ${{ secrets.RECEIPTS_SUPABASE_URL }}
          RECEIPTS_SUPABASE_KEY: ${{ secrets.RECEIPTS_SUPABASE_KEY }}
          RECEIPTS_TOKEN: ${{ secrets.RECEIPTS_TOKEN }}
          RECEIPTS_INGEST_URL: ${{ secrets.RECEIPTS_INGEST_URL }}
        run: |
          if [ -z "$RECEIPTS_SUPABASE_URL$RECEIPTS_TOKEN" ]; then
            echo "::notice::No Supabase target configured — skipping publish (artefact still uploaded)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npx receipts publish --in "$RECEIPT_DIR"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            DIR="${RECEIPT_DIR%/}"
            echo "REPORT_URL=$(node -p "require('./$DIR/publish.json').reportUrl")" >> "$GITHUB_ENV"
            echo "VIDEO_URL=$(node -p "require('./$DIR/publish.json').videoUrl || ''")" >> "$GITHUB_ENV"
          else
            echo "::warning::receipts publish failed — falling back to the artefact link."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload receipt artefact
        if: steps.check.outputs.present == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: receipt
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: warn

      - name: Comment on PR
        if: steps.check.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const published = ${{ toJSON(steps.publish.outputs.published) }} === 'true';
            const reportUrl = ${{ toJSON(env.REPORT_URL) }} || '';
            const videoUrl = ${{ toJSON(env.VIDEO_URL) }} || '';
            const artefactUrl = ${{ toJSON(steps.upload.outputs.artifact-url) }} || '';
            const marker = '<!-- receipts-comment -->';

            const lines = [marker, '### 🧾 Receipt ready — watch the work', ''];
            if (published && reportUrl) {
              lines.push(`**[▶ Open the hosted receipt](${reportUrl})** — leads with the video, then expected-vs-actual, then how the agent thought.`);
              if (videoUrl) lines.push('', `🎥 **[Jump straight to the recording](${videoUrl})**`);
            } else {
              lines.push('A visual-QA walkthrough + reasoning record for this PR has been generated.');
            }
            lines.push('', artefactUrl
              ? `<sub>Prefer a local copy? [Download the artefact](${artefactUrl}) and open \`index.html\` — no server needed.</sub>`
              : '<sub>Download the `receipt` artefact from the workflow run and open `index.html` — no server needed.</sub>');
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
