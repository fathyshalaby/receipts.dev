# Receipts — visual-QA walkthrough + reasoning record for a PR.
#
# This is a TEMPLATE, not a hard dependency. Copy it into your own repo and
# adjust `Boot app` / install steps for your stack. It expects the agent to have
# committed `receipt-input.json` to the branch (or set the path below).
#
# Receipts are gitignored by default, so this workflow regenerates them in CI
# and uploads the folder as an artefact + comments the link on the PR.

name: receipts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install the receipts tool. Use the published package, or `npm ci` if you
      # vendored this repo. Here we install Playwright + the local toolchain.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (pinned Chromium)
        run: npx playwright install --with-deps chromium

      # The agent must have committed receipt-input.json. If absent, skip cleanly.
      - name: Check for receipt-input.json
        id: check
        run: |
          if [ -f receipt-input.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No receipt-input.json on this branch — skipping receipt generation."
          fi

      # `receipts qa` boots the app itself when receipt-input.json has a
      # startCommand. If your app needs a separate boot, do it here and pass --url.
      - name: Run QA + build receipt
        if: steps.check.outputs.present == 'true'
        env:
          RECEIPTS_API_KEY: ${{ secrets.RECEIPTS_API_KEY }} # optional; omit for visual-only
          RECEIPTS_MODEL: ${{ vars.RECEIPTS_MODEL }}
        run: |
          npx receipts qa --input receipt-input.json || echo "QA reported failing claims (continuing to publish the receipt)"
          # Find the receipt folder that was just produced.
          RECEIPT_DIR=$(ls -d .receipts/*/ | head -n1)
          echo "RECEIPT_DIR=$RECEIPT_DIR" >> "$GITHUB_ENV"
          npx receipts build --in "$RECEIPT_DIR"

      - name: Upload receipt artefact
        if: steps.check.outputs.present == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: receipt
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: warn

      - name: Comment on PR
        if: steps.check.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.upload.outputs.artifact-url) }} || '';
            const marker = '<!-- receipts-comment -->';
            const body = [
              marker,
              '### 🧾 Receipt ready — watch the work',
              '',
              'A visual-QA walkthrough + reasoning record for this PR has been generated.',
              url ? `**[⬇ Download the receipt artefact](${url})**` : 'Download the `receipt` artefact from the workflow run.',
              '',
              'Unzip it and open `index.html` — no server needed. Lead with the video, then expected-vs-actual, then how the agent thought.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
