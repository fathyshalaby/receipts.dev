# CI — typecheck + the full test suite (unit + the golden end-to-end pipeline).
# The e2e test boots the bundled demo app, runs qa → build → verify in a real
# browser, and asserts the receipt is intact and tamper-evident, so the trust
# path is exercised on every PR (not just the pure helpers).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (pinned Chromium)
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + e2e)
        run: npm test
