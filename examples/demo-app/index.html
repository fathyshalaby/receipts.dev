<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipts Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2330, #0b0d10);
      color: #e6e9ee; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .app { width: min(460px, 92vw); }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
    p.sub { color: #8b95a3; margin: 0 0 20px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a323c;
      background: #14181d; color: #e6e9ee; font-size: 14px;
    }
    button {
      padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer;
      background: #6ea8fe; color: #0b0d10; font-weight: 700; font-size: 14px;
    }
    ul { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 8px; }
    li {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #262d36; background: #14181d;
      display: flex; justify-content: space-between; align-items: center;
    }
    li button { background: transparent; color: #8b95a3; padding: 2px 6px; font-weight: 500; }
    .empty { margin-top: 18px; padding: 22px; text-align: center; color: #8b95a3;
      border: 1px dashed #2a323c; border-radius: 10px; }
    .count { color: #6ea8fe; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Receipts Demo</h1>
    <p class="sub">A tiny task list — <span class="count" id="count">0</span> tasks.</p>
    <div class="row">
      <input id="task" placeholder="Add a task…" aria-label="New task" />
      <button id="add">Add</button>
    </div>
    <div id="empty" class="empty">No tasks yet</div>
    <ul id="list" aria-label="Task list"></ul>
  </main>
  <script>
    const tasks = [];
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const input = document.getElementById('task');

    function render() {
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = t;
        const del = document.createElement('button');
        del.textContent = 'remove';
        del.onclick = () => { tasks.splice(i, 1); render(); };
        li.append(span, del);
        list.appendChild(li);
      });
      empty.style.display = tasks.length ? 'none' : 'block';
      count.textContent = String(tasks.length);
    }

    function add() {
      const v = input.value.trim();
      if (!v) return;
      tasks.push(v);
      input.value = '';
      render();
    }

    document.getElementById('add').addEventListener('click', add);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    render();
  </script>
</body>
</html>
